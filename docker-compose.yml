services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://postgres:postgres@db:5432/assistant
    depends_on:
      db:
        condition: service_healthy
    # Build the index into Postgres on start, then serve.
    command: sh -c "python -m app.rag.ingest && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
