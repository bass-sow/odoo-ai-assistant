<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odoo AI Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ec; --accent:#714b67; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --ink:#e7e9ee; --muted:#9aa1b0; --line:#2c303a; --accent:#c28bb5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  nav { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px;
               border-radius:8px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  textarea { width:100%; min-height:90px; font:inherit; padding:10px; border-radius:8px;
             border:1px solid var(--line); background:var(--bg); color:var(--ink); resize:vertical; }
  .row { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .go { background:var(--accent); color:#fff; border:0; padding:8px 18px; border-radius:8px; font:inherit; cursor:pointer; }
  .hint { color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline dotted; }
  #out { margin-top:16px; white-space:pre-wrap; }
  .src { color:var(--muted); font-size:13px; margin-top:12px; }
  details { margin-top:10px; font-size:13px; color:var(--muted); }
  pre { overflow-x:auto; background:var(--bg); padding:10px; border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1>Odoo AI Assistant</h1>
  <p class="sub">Warehouse procedures, live stock data and delivery note extraction.</p>
  <nav>
    <button data-mode="agent" class="on">Ask the warehouse</button>
    <button data-mode="ask">Procedures</button>
    <button data-mode="extract">Delivery note</button>
  </nav>
  <div class="card">
    <textarea id="q"></textarea>
    <div class="row">
      <button class="go" id="go">Send</button>
      <span id="examples"></span>
    </div>
    <div id="out"></div>
  </div>
</main>
<script>
const examples = {
  agent: ["Which lots expire this week and what should we do with them?", "Where is the mozzarella stored?", "Deliveries for Hotel Mar Blau"],
  ask: ["How do I receive goods with GS1 labels?", "What is FEFO and when can I skip it?"],
  extract: ["(paste the text of a delivery note)"],
};
let mode = "agent";
// Deployed instances need ?key=... in the URL; it is sent as X-API-Key.
const apiKey = new URLSearchParams(location.search).get("key") || "";
const $ = (id) => document.getElementById(id);
function setMode(m) {
  mode = m;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("examples").innerHTML = "";
  examples[m].forEach(e => {
    const s = document.createElement("span"); s.className = "hint"; s.textContent = e;
    s.onclick = () => { $("q").value = m === "extract" ? sample : e; };
    $("examples").appendChild(s);
  });
  $("out").innerHTML = "";
}
const sample = `LÁCTEOS DEL VALLÈS SL - CIF B-12345678
ALBARÁN Nº AV-2026-1187   Fecha: 17/11/2026   Su pedido: P00102
Ref       Descripción              Cant.  Lote         Cad.
YOG-500   Yogur griego 500g        240    YOG-2612-C   10/12/2026
MOZ-125   Mozzarella fresca 125g   150    MOZ-2612-B   05/12/2026
QF-200    Queso fresco 200g        60     QF-2611-A    28/11/2026`;
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode("agent");

$("go").onclick = async () => {
  const q = $("q").value.trim(); if (!q) return;
  $("out").textContent = "Thinking…";
  try {
    let r;
    if (mode === "extract") {
      const f = new FormData(); f.append("text", q);
      r = await fetch("/extract", { method: "POST", body: f, headers: { "X-API-Key": apiKey } });
    } else {
      r = await fetch("/" + mode, { method: "POST", headers: { "Content-Type": "application/json", "X-API-Key": apiKey },
                                     body: JSON.stringify({ question: q }) });
    }
    const data = await r.json();
    if (!r.ok) { $("out").textContent = "Error: " + (data.detail || r.status); return; }
    render(data);
  } catch (e) { $("out").textContent = "Error: " + e; }
};

function render(d) {
  const out = $("out"); out.innerHTML = "";
  if (mode === "extract") {
    const h = document.createElement("div");
    h.textContent = d.ready_to_import ? "Ready to import into Odoo." : "Needs review:\n- " + d.issues.join("\n- ");
    out.appendChild(h);
    const pre = document.createElement("pre"); pre.textContent = JSON.stringify(d, null, 2); out.appendChild(pre);
    return;
  }
  const a = document.createElement("div"); a.textContent = d.answer; out.appendChild(a);
  if (d.sources && d.sources.length) {
    const s = document.createElement("div"); s.className = "src";
    s.textContent = "Sources: " + d.sources.map((x, i) => `[${i + 1}] ${x.title}`).join(" · ");
    out.appendChild(s);
  }
  if (d.steps && d.steps.length) {
    const det = document.createElement("details");
    det.innerHTML = "<summary>Tool calls (" + d.steps.length + ")</summary>";
    const pre = document.createElement("pre"); pre.textContent = JSON.stringify(d.steps, null, 2);
    det.appendChild(pre); out.appendChild(det);
  }
}
</script>
</body>
</html>
