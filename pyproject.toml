[project]
name = "odoo-ai-assistant"
version = "0.1.0"
description = "LLM assistant for Odoo warehouses: RAG over procedures, tool-calling agent over stock data, delivery note extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.1"]
aws = ["mangum>=0.17", "boto3>=1.34"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses File()/Form() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
